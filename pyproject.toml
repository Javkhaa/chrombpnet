[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chrombpnet"
version = "1.0.1"
description = "ChromBPNet predicts chromatin accessibility from sequence (multi-task nucleosome fork)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9,<3.12"   # TensorFlow 2.15 supports CPython 3.9-3.11
authors = [{ name = "Kundaje Lab" }, { name = "Javkhaa (nucleosome fork)" }]
keywords = ["scATAC", "chromatin", "deep-learning", "nucleosome", "genomics"]

# Core runtime + training deps. TensorFlow is platform-marked:
#   linux  -> tensorflow[and-cuda] (bundles CUDA 12 libs; runs on H100 under the
#             host CUDA 13 driver, which is backward compatible)
#   darwin -> plain tensorflow (CPU) for local development / smoke tests
# TF 2.15 is the last release with Keras 2 as default, so the existing tf.keras
# code ports unchanged (the upstream pin of tensorflow==2.8 has no Hopper kernels).
dependencies = [
  "tensorflow[and-cuda]==2.15.* ; sys_platform == 'linux'",
  "tensorflow==2.15.* ; sys_platform != 'linux'",
  "tensorflow-probability==0.23.0",
  "numpy>=1.24,<2",
  "pandas>=1.3",
  "scipy>=1.10",
  "h5py>=3.1",
  "pyfaidx>=0.6",
  "pyBigWig>=0.3.18",
  "matplotlib>=3.5",
  "tqdm>=4.48",
  "protobuf>=3.20,<5",
]

[project.optional-dependencies]
# Peak calling for the preprocessing/baseline step (call_peaks.sh).
peaks = ["macs2>=2.2.9"]
# Model interpretation (DeepLIFT/TF-MoDISco/SHAP) — not needed for training.
interpret = ["deeplift==0.6.13.0", "modisco-lite==2.0.7", "kundajelab-shap==1", "deepdish==0.3.7"]
# HTML/PDF QC reports.
report = ["weasyprint", "matplotlib-venn"]

[project.urls]
Homepage = "https://github.com/Javkhaa/chrombpnet"
Upstream = "https://github.com/kundajelab/chrombpnet"

[project.scripts]
chrombpnet = "chrombpnet.CHROMBPNET:main"
print_meme_motif_file = "chrombpnet.data:print_meme_motif_file"
# multi-task additions
chrombpnet-build-tracks = "chrombpnet.multitask.build_label_tracks:main"
chrombpnet-train-multitask = "chrombpnet.multitask.train_multitask:main"

[tool.setuptools.packages.find]
include = ["chrombpnet*"]

[tool.setuptools.package-data]
# Tn5/DNase reference motifs (used by auto_shift_detect) + MEME databases.
chrombpnet = ["data/*"]

# Note: external (non-pip) tools still required on PATH for preprocessing:
#   samtools, bedtools, ucsc-bedGraphToBigWig, meme  (install via conda/system).
#   On the H100, setup_h100.sh handles the Python env via uv; install those
#   system tools separately (e.g. `conda install -c bioconda samtools bedtools
#   ucsc-bedgraphtobigwig meme`).
