[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chrombpnet"
version = "1.0.1"
description = "ChromBPNet predicts chromatin accessibility from sequence (multi-task nucleosome fork)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.12"
authors = [{ name = "Kundaje Lab" }, { name = "Javkhaa (nucleosome fork)" }]
keywords = ["scATAC", "chromatin", "deep-learning", "nucleosome", "genomics"]

# Core runtime for preprocessing, label building, and PyTorch training utilities.
# The owned multi-task path is PyTorch via the cpu/gpu extras below.
dependencies = [
  "numpy>=1.24,<2",
  "pandas>=1.3",
  "polars>=1.0",
  "scipy>=1.10",
  "h5py>=3.1",
  "pyfaidx>=0.6",
  "pyBigWig>=0.3.18",
  "matplotlib>=3.5",
  "tqdm>=4.48",
  "protobuf>=3.20,<5",
  "wandb>=0.16",
]

[project.optional-dependencies]
# PyTorch training stack, matching Prima's CPU/GPU-extra convention.
# Direct wheel URLs keep this repo on Prima's tested CUDA 12.8 nightly line even
# when the public nightly simple index stops advertising older builds.
cpu = [
  "torch @ https://download-r2.pytorch.org/whl/nightly/cpu/torch-2.12.0.dev20260407%2Bcpu-cp311-cp311-manylinux_2_28_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torch @ https://download-r2.pytorch.org/whl/nightly/cpu/torch-2.12.0.dev20260407%2Bcpu-cp311-cp311-manylinux_2_28_aarch64.whl ; sys_platform == 'linux' and platform_machine == 'aarch64'",
]
gpu = [
  "torch @ https://download-r2.pytorch.org/whl/nightly/cu128/torch-2.12.0.dev20260407%2Bcu128-cp311-cp311-manylinux_2_28_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "torch @ https://download-r2.pytorch.org/whl/nightly/cu128/torch-2.12.0.dev20260407%2Bcu128-cp311-cp311-manylinux_2_28_aarch64.whl ; sys_platform == 'linux' and platform_machine == 'aarch64'",
  "pytorch-triton @ https://download-r2.pytorch.org/whl/nightly/pytorch_triton-3.6.0%2Bgit5261b273-cp311-cp311-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "pytorch-triton @ https://download-r2.pytorch.org/whl/nightly/pytorch_triton-3.6.0%2Bgit5261b273-cp311-cp311-linux_aarch64.whl ; sys_platform == 'linux' and platform_machine == 'aarch64'",
  "triton @ https://download-r2.pytorch.org/whl/nightly/triton-3.7.0%2Bgit9c288bc5-cp311-cp311-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "triton @ https://download-r2.pytorch.org/whl/nightly/triton-3.7.0%2Bgit9c288bc5-cp311-cp311-linux_aarch64.whl ; sys_platform == 'linux' and platform_machine == 'aarch64'",
]
# Peak calling for the preprocessing step (call_peaks.sh).
peaks = ["macs3>=3.0"]

[project.urls]
Homepage = "https://github.com/Javkhaa/chrombpnet"
Upstream = "https://github.com/kundajelab/chrombpnet"

[project.scripts]
chrombpnet = "chrombpnet.CHROMBPNET:main"
# multi-task additions
chrombpnet-build-tracks = "chrombpnet.multitask.build_label_tracks:main"
chrombpnet-train-multitask = "chrombpnet.multitask.train_multitask_torch:main"
chrombpnet-train-multicell = "chrombpnet.multitask.train_multicell_torch:main"
chrombpnet-eval-multitask = "chrombpnet.multitask.evaluate_multitask:main"

[tool.setuptools.packages.find]
include = ["chrombpnet*"]

# Note: external (non-pip) tools still required on PATH for preprocessing:
#   samtools and bedtools for peak/nonpeak preparation.
#   On the H100, setup_h100.sh handles the Python env via uv.

[tool.uv]
prerelease = "allow"
index-strategy = "unsafe-best-match"
conflicts = [
  [
    { package = "chrombpnet", extra = "cpu" },
    { package = "chrombpnet", extra = "gpu" },
  ],
]
